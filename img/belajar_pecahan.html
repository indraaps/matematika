<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gubuk Belajar Pecahan - Materi pembelajaran pecahan interaktif untuk siswa SD di hutan ajaib.">
    <title>Rimba Pecahan - Gubuk Belajar</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Modern Design Tokens & Variables Baseline */
        :root {
            --primary-green: #2d8a4e;
            --light-green: #52b788;
            --accent-orange: #f0932b;
            --accent-blue: #2cc4b6;
            --accent-purple: #8e44ad;
            --sunny-yellow: #f9ca24;
            --text-dark: #1a4a2a;
            --bg-card: #ffffff;
            --shadow-sm: 0 4px 6px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px rgba(45, 138, 78, 0.08);
            --shadow-lg: 0 16px 32px rgba(45, 138, 78, 0.12);
            --transition-smooth: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .station-panel {
            max-width: 850px;
            margin: 32px auto;
            padding: 24px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow-lg);
        }

        .step-content {
            display: none;
            animation: cubic-bezier(0.4, 0, 0.2, 1) fadeIn 0.6s forwards;
        }

        .step-content.active {
            display: block;
        }

        /* Kid-Card Premium Stylings */
        .kid-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 32px;
            position: relative;
            box-shadow: var(--shadow-md);
            border: 2px solid #f0f5f2;
            transition: var(--transition-smooth);
            margin-bottom: 24px;
            overflow: hidden;
        }

        .kid-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: rgba(82, 183, 136, 0.3);
        }

        .card-accent {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
        }
        .card-accent.green { background: linear-gradient(90deg, var(--primary-green), var(--light-green)); }
        .card-accent.blue { background: linear-gradient(90deg, #3498db, var(--accent-blue)); }
        .card-accent.orange { background: linear-gradient(90deg, #e67e22, var(--accent-orange)); }
        .card-accent.purple { background: linear-gradient(90deg, #9b59b6, var(--accent-purple)); }

        /* Typography & Layout elements */
        .main-title {
            font-family: 'Baloo 2', cursive, sans-serif;
            font-size: 2.4rem;
            color: var(--primary-green);
            text-align: center;
            margin-bottom: 24px;
            font-weight: 800;
        }

        .fun-callout {
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 16px;
            line-height: 1.6;
            transition: var(--transition-smooth);
        }
        .fun-callout.green { background: #eef9f3; border-left: 6px solid var(--primary-green); color: #1e5331; }
        .fun-callout.red { background: #fff5f5; border-left: 6px solid #e74c3c; color: #c0392b; }
        .fun-callout.yellow { background: #fef9e7; border-left: 6px solid var(--sunny-yellow); color: #7d6608; }
        .fun-callout.blue { background: #ebf5fb; border-left: 6px solid #3498db; color: #21618c; }
        .fun-callout.purple { background: #f5eef8; border-left: 6px solid var(--accent-purple); color: #6c3483; }

        /* Advanced Component Grid */
        .topic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }

        /* Custom Fraction Display Engine */
        .fraction-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            margin: 20px 0;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.03);
            border: 2px dashed #d5e8dc;
        }

        .fraction-render {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Baloo 2', sans-serif;
            font-weight: 800;
            background: #f4fbf7;
            padding: 12px 24px;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
        }

        .fraction-line-ui {
            border-bottom: 4px solid var(--text-dark);
            width: 40px;
            margin: 6px 0;
            border-radius: 2px;
        }

        /* Video Player Wrapper */
        .yt-player {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            margin: 24px 0;
            background: #000;
            box-shadow: 0 12px 30px rgba(45,138,78,0.2);
            aspect-ratio: 16/9;
        }
        .yt-player iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Stepper & Navigation Controls */
        .step-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 32px;
            gap: 16px;
        }

        /* Micro-Animations Engine */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes microBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .animate-bounce-slow {
            display: inline-block;
            animation: microBounce 2.5s infinite ease-in-out;
        }
    </style>
</head>

<body>
    <script src="js/script.js"></script>
    <script>
        renderTopNav('Gubuk Belajar', true, 'dashboard.html');

        var totalSteps = 4; 
        var currentStep = 1;

        document.body.insertAdjacentHTML('beforeend', `
        <main class="page-container">
            <div class="glass-panel station-panel">
                <div class="stepper" id="stepper"></div>

                <!-- STEP 1: ATP -->
                <div class="step-content active" id="step1">
                    <div class="kid-card">
                        <div class="card-accent green"></div>
                        <h2 class="main-title">Alur Tujuan Pembelajaran</h2>
                        <div class="fun-callout green">
                            <p style="font-size: 1.1rem; margin: 0; font-weight: 600;">• Murid dapat menunjukkan pemahaman pecahan sebagai konteks membagi sebuah benda.</p>
                        </div>
                        <div class="fun-callout red">
                            <p style="font-size: 1.1rem; margin: 0; font-weight: 600;">• Murid dapat melakukan perbandingan dan pengurutan pecahan dengan pembilang satu dan antar pecahan dengan penyebut yang sama.</p>
                        </div>
                    </div>
                </div>

                <!-- STEP 2: VIDEO INTERAKTIF -->
                <div class="step-content" id="step2">
                    <div class="kid-card">
                        <div class="card-accent blue"></div>
                        <div style="font-size: 4.5rem; text-align: center; margin: 12px 0;" class="animate-bounce-slow">🦉</div>
                        <h2 class="main-title">🎬 Apa itu Pecahan?</h2>
                        <p style="text-align:center; font-size: 1.15rem; margin-bottom:24px; color: #2d8a4e; font-weight: bold;">
                            Halo, Penjelajah Rimba! Sebelum kita menjelajah lebih jauh, yuk tonton video seru ini untuk mengenal apa itu pecahan!
                        </p>
                        <div class="yt-player">
                            <iframe 
                                src="https://www.youtube.com/embed/nwXZV4fLwx8" 
                                title="Video Pembelajaran Pecahan" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                                allowfullscreen>
                            </iframe>
                        </div>
                        <p style="text-align:center; color: var(--sunny-yellow); font-size:1.1rem; margin-top:20px; font-weight:900; background: var(--text-dark); padding: 12px; border-radius: 50px; box-shadow: var(--shadow-sm);">
                            📺 Tonton video di atas langsung di halaman ini ya!
                        </p>
                    </div>
                </div>

                <!-- STEP 3: PENJELASAN UTAMA -->
                <div class="step-content" id="step3">
                    <div class="kid-card">
                        <div class="card-accent orange"></div>
                        <h2 class="main-title">Penjelasan Pecahan 🍰</h2>
                        
                        <div class="fun-callout yellow">
                            <h3 style="color: var(--text-dark); font-family: 'Baloo 2'; font-size: 1.4rem; margin-top:0; margin-bottom: 8px;">1. Pecahan</h3>
                            <p style="font-size: 1.1rem; line-height: 1.7; margin-bottom: 16px; color: #2c3e50;">
                                Pecahan adalah bilangan yang digunakan untuk menyatakan bagian dari suatu keseluruhan. Pecahan menunjukkan bahwa suatu benda atau kumpulan benda dibagi menjadi beberapa bagian yang sama besar. Pecahan ditulis dalam bentuk:
                            </p>
                            
                            <div class="fraction-box">
                                <div class="fraction-render">
                                    <span style="font-size: 1.8rem; color: #e67e22;">a</span>
                                    <div class="fraction-line-ui"></div>
                                    <span style="font-size: 1.8rem; color: #2980b9;">b</span>
                                </div>
                                <div style="font-size: 1.05rem; line-height: 1.6; color: var(--text-dark);">
                                    <strong>Keterangan:</strong><br>
                                    🔢 <strong style="color: #e67e22;">a disebut pembilang</strong>, yaitu angka yang menunjukkan banyaknya bagian yang diambil atau diperhatikan.<br>
                                    🔢 <strong style="color: #2980b9;">b disebut penyebut</strong>, yaitu angka yang menunjukkan jumlah seluruh bagian yang sama besar.
                                </div>
                            </div>

                            <div style="background: rgba(46, 204, 113, 0.15); padding: 16px; border-radius: 12px; border-left: 5px solid var(--light-green); font-size: 1.05rem; color: #1e5331;">
                                <strong>Contoh:</strong> ¾ <br style="margin-bottom: 4px;">
                                Pada pecahan tersebut:<br>
                                • Angka <span style="font-weight:bold; color:#e67e22;">3</span> adalah pembilang<br>
                                • Angka <span style="font-weight:bold; color:#2980b9;">4</span> adalah penyebut
                            </div>
                        </div>
                        
                        <div class="topic-grid">
                            <div class="fun-callout blue" style="margin: 0; display: flex; flex-direction: column; justify-content: space-between;">
                                <div>
                                    <h3 style="font-family: 'Baloo 2'; font-size: 1.3rem; margin-top:0; margin-bottom: 10px;">⚖️ 2. Membandingkan Pecahan</h3>
                                    <p style="font-size: 1.05rem; line-height: 1.6; margin-bottom: 16px;">
                                        Membandingkan pecahan adalah proses menentukan hubungan nilai antara dua pecahan pecahan atau lebih untuk mengetahui pecahan mana yang nilainya lebih besar (&gt;), lebih kecil (&lt;) atau sama besar (=). Proses ini dilakukan dengan melihat porsi atau ukuran bagian dari keseluruhan yang diwakili oleh pecahan-pecahan tersebut.
                                    </p>
                                </div>
                                <div style="background: #ffffff; padding: 12px; border-radius: 10px; box-shadow: var(--shadow-sm); font-size: 1rem;">
                                    <strong>Contoh:</strong> ½ &gt; ¼ <br>
                                    Artinya, satu per dua lebih besar daripada satu per empat karena satu benda yang dibagi menjadi 2 bagian menghasilkan potongan yang lebih besar dibandingkan jika dibagi menjadi 4 bagian.
                                </div>
                            </div>

                            <div class="fun-callout purple" style="margin: 0;">
                                <h3 style="font-family: 'Baloo 2'; font-size: 1.3rem; margin-top:0; margin-bottom: 10px;">📊 3. Mengurutkan Pecahan</h3>
                                <p style="font-size: 1.05rem; line-height: 1.6; margin-bottom: 12px;">
                                    Mengurutkan pecahan adalah proses menyusun tiga pecahan atau lebih secara berurutan berdasarkan nilainya. Penyusunan ini dapat dilakukan dengan dua cara:
                                </p>
                                <ul style="font-size: 1.05rem; line-height: 1.7; margin-left: 20px; padding: 0; color: inherit;">
                                    <li style="margin-bottom: 8px;"><strong>Urutan Naik (Ascending):</strong> Menyusun pecahan mulai dari nilai yang paling kecil ke paling besar.</li>
                                    <li><strong>Urutan Turun (Descending):</strong> Menyusun pecahan mulai dari nilai yang paling besar ke paling kecil.</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- STEP 4: KESIMPULAN BERGAYA MODERN PREMIUM (2 POIN UTAMA KONSISTEN) -->
                <div class="step-content" id="step4">
                    <div class="kid-card" style="border: 2px solid #eef5f1;">
                        <div class="card-accent green"></div>
                        <h2 class="main-title" style="font-size: 2.5rem; margin-bottom: 32px;">Kesimpulan Belajar Kita 🎉</h2>
                        
                        <!-- Premium Bento Box Layout Engine -->
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; margin-bottom: 32px;">
                            
                            <!-- Kolom Rangkuman 1 -->
                            <div style="background: linear-gradient(135deg, #ffffff, #f4fbf7); border: 2px solid var(--light-green); border-radius: 20px; padding: 24px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; justify-content: space-between;">
                                <div>
                                    <div style="background: var(--light-green); color: white; display: inline-block; padding: 6px 16px; border-radius: 30px; font-family: 'Baloo 2'; font-weight: 800; font-size: 1.1rem; margin-bottom: 16px; box-shadow: 0 4px 10px rgba(82,183,136,0.2);">
                                        🍰 1. Pecahan
                                    </div>
                                    <p style="font-size: 1.05rem; line-height: 1.7; color: var(--text-dark); margin: 0; text-align: justify;">
                                        Pecahan adalah bilangan yang digunakan untuk menyatakan bagian dari suatu keseluruhan yang dibagi menjadi bagian-bagian sama besar. Pecahan terdiri dari pembilang yang menunjukkan banyak bagian yang diambil dan penyebut yang menunjukkan jumlah seluruh bagian yang sama besar.
                                    </p>
                                </div>
                                
                                <!-- Mini Visualizer Metric Blueprint -->
                                <div style="margin-top: 20px; background: #ffffff; border: 2px dashed #b7e4c7; border-radius: 12px; padding: 12px; display: flex; justify-content: space-around; align-items: center;">
                                    <div style="text-align: center;"><span style="display:block; font-size: 1.2rem; font-weight: 800; color:#e67e22;">Pembilang</span><span style="font-size:0.85rem; color:#7f8c8d;">(Bagian Diambil)</span></div>
                                    <div style="font-size: 1.5rem; color: #bdc3c7;">➔</div>
                                    <div style="text-align: center;"><span style="display:block; font-size: 1.2rem; font-weight: 800; color:#2980b9;">Penyebut</span><span style="font-size:0.85rem; color:#7f8c8d;">(Semua Bagian)</span></div>
                                </div>
                            </div>

                            <!-- Kolom Rangkuman 2 -->
                            <div style="background: linear-gradient(135deg, #ffffff, #eef9f9); border: 2px solid var(--accent-blue); border-radius: 20px; padding: 24px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; justify-content: space-between;">
                                <div>
                                    <div style="background: var(--accent-blue); color: white; display: inline-block; padding: 6px 16px; border-radius: 30px; font-family: 'Baloo 2'; font-weight: 800; font-size: 1.1rem; margin-bottom: 16px; box-shadow: 0 4px 10px rgba(44,196,182,0.2);">
                                        ⚖️ 2. Membandingkan Pecahan
                                    </div>
                                    <p style="font-size: 1.05rem; line-height: 1.7; color: #0f4c5c; margin: 0; text-align: justify;">
                                        Membandingkan pecahan dilakukan untuk mengetahui pecahan yang lebih besar, lebih kecil, atau sama besar. Pada pecahan dengan pembilang satu, semakin kecil penyebutnya maka semakin besar nilai pecahannya, sedangkan pada pecahan dengan penyebut yang sama, semakin besar pembilangnya maka semakin besar nilai pecahannya.
                                    </p>
                                </div>

                                <!-- UX Rules Alert Box -->
                                <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 8px;">
                                    <div style="background: #ffffff; padding: 8px 12px; border-radius: 8px; border-left: 4px solid #f39c12; font-size: 0.9rem; color:#7f8c8d;"><strong style="color:#d35400;">Pembilang 1:</strong> Penyebut makin kecil = Nilai pecahan makin besar!</div>
                                    <div style="background: #ffffff; padding: 8px 12px; border-radius: 8px; border-left: 4px solid #c0392b; font-size: 0.9rem; color:#7f8c8d;"><strong style="color:#c0392b;">Penyebut Sama:</strong> Pembilang makin besar = Nilai pecahan makin besar!</div>
                                </div>
                            </div>

                        </div>

                        <!-- Footer Cheer Section -->
                        <div style="text-align: center; margin-top: 32px; padding-top: 24px; border-top: 2px dashed #d5e8dc;">
                            <div style="font-size: 3.5rem; margin-bottom: 8px;" class="animate-bounce-slow">🌟</div>
                            <p style="font-family: 'Baloo 2'; font-size: 1.3rem; font-weight: 800; color: var(--primary-green); margin: 0 0 4px 0;">
                                Tetap semangat berlatihnya ya!
                            </p>
                            <p style="font-size: 1.1rem; color: #555; margin: 0;">
                                Semakin sering berlatih, kamu pasti akan semakin jago! 🦉✨
                            </p>
                        </div>
                    </div>
                </div>

                <!-- BUTTON CONTROLLER NAVIGASI -->
                <div class="step-nav">
                    <button class="btn-secondary" id="btnPrev" style="display:none" onclick="changeStep(-1)">⬅ Sebelumnya</button>
                    <div style="flex:1"></div>
                    <button class="btn-primary" id="btnNext" onclick="changeStep(1)">Selanjutnya ➡</button>
                </div>
            </div>
        </main>`);

        function renderStepper() {
            const el = document.getElementById('stepper');
            let html = '';
            for (let i = 1; i <= totalSteps; i++) {
                const cls = i === currentStep ? 'active' : (i < currentStep ? 'completed' : '');
                html += `<div class="step-dot ${cls}" onclick="goToStep(${i})">${i < currentStep ? '✓' : i}</div>`;
                if (i < totalSteps) html += `<div class="step-line ${i < currentStep ? 'completed' : ''}"></div>`;
            }
            el.innerHTML = html;
        }

        function changeStep(dir) {
            const next = currentStep + dir;
            if (next < 1 || next > totalSteps) {
                if (next > totalSteps) {
                    SpaceStore.completeMission('mission1');
                    SpaceStore.addBadge('📚');
                    navigasiHalaman('dashboard.html');
                }
                return;
            }
            goToStep(next);
        }

        function goToStep(n) {
            AudioManager.playClick();
            document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
            document.getElementById('step' + n).classList.add('active');
            currentStep = n;
            renderStepper();
            document.getElementById('btnPrev').style.display = n > 1 ? '' : 'none';
            document.getElementById('btnNext').textContent = n === totalSteps ? 'Selesai & Lanjut 🌿' : 'Selanjutnya ➡';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        renderStepper();
    </script>
</body>

</html>
